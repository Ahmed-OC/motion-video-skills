<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>seek-template v2.0 — Universal Deterministic Studio Starter</title>
<style>
  html, body { margin: 0; height: 100%; background: #0B0E14; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
<!-- Load MotionKit SDK (copy motion-kit.js next to index.html or reference the skill path) -->
<script src="./motion-kit.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<script>
/* ============================================================================
   SEEK TEMPLATE v2.0 — Deterministic Video-as-Code Contract + MotionKit (MVS)
     window.VIDEO        { width, height, fps, duration }
     window.seek(t)      pure function of t (seconds) — ZERO rAF / Date.now / Math.random
     window.renderAudio()optional deterministic WAV stem (Warm Studio Bed)
     window.onReady()    async font & SVG asset preloading before frame 0
============================================================================ */
'use strict';

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

let TL = {
  fps: 30, width: 1920, height: 1080, duration: 12, bpm: 120,
  meta: { aspect: '16:9', style: 'linear-dark', title: 'Motion Video v2.0' },
  scenes: [
    { id: 'hook',  start: 0, duration: 4, text: 'STUDIO MOTION IN PURE CODE', transition: 'whip' },
    { id: 'proof', start: 4, duration: 5, text: 'ZERO OVERLAP · EXACT TELEMETRY', transition: 'whip' },
    { id: 'cta',   start: 9, duration: 3, text: 'SHIP DETERMINISTIC VIDEO', transition: 'portal' }
  ],
  captions: []
};

/* ============================================================================
   MODULAR SCENE FUNCTIONS — Keep 1 function per scene so `audit_telemetry.mjs`
   can lock clean scenes and repair faulty scenes independently without regression!
============================================================================ */
const SCENES = {
  hook({ ctx, localT, safe, width, height, theme, scene }) {
    MVS.drawBackdrop(ctx, width, height, localT, { theme, variant: 'mesh-grid' });
    MVS.drawHudOverlay(ctx, width, height, localT, { theme, tag: 'MVS // 01' });

    const isPortrait = safe.aspect === '9:16';
    const slots = isPortrait
      ? MVS.vstack(safe, [0.42, 0.58], 28)
      : MVS.hstack(safe, [0.54, 0.46], 36);

    const leftRows = MVS.vstack(slots[0], [{ px: 34 }, 0.62, 0.38], 16);
    MVS.drawTextAutoFit(ctx, 'DETERMINISTIC ENGINE v2.0', leftRows[0], {
      id: 'hook_kicker', role: 'label', color: theme.accent, fontFamily: theme.fontMono,
      localT, entrance: { delay: 0.04, dur: 0.4 }
    });
    MVS.drawTextAutoFit(ctx, scene.text, leftRows[1], {
      id: 'hook_hero', role: 'hero', color: theme.fg, fontFamily: theme.fontDisplay,
      localT, entrance: { delay: 0.10, dur: 0.52, bounce: 0.12 }
    });
    MVS.drawTextAutoFit(ctx, 'Collision-free layout, OKLCH color science & sub-2s visual compiler.', leftRows[2], {
      id: 'hook_sub', role: 'subtitle', color: theme.muted, fontFamily: theme.fontBody,
      localT, entrance: { delay: 0.22, dur: 0.50 }
    });

    MVS.drawGlobeWire(ctx, slots[1], localT, { id: 'hook_globe', theme });
  },

  proof({ ctx, localT, safe, width, height, theme, scene }) {
    MVS.drawBackdrop(ctx, width, height, localT + 4, { theme, variant: 'blueprint' });
    MVS.drawHudOverlay(ctx, width, height, localT + 4, { theme, tag: 'MVS // 02' });

    const [headerSlot, contentSlot] = MVS.vstack(safe, [{ px: 76 }, 1], 24);
    MVS.drawTextAutoFit(ctx, scene.text, headerSlot, {
      id: 'proof_title', role: 'title', color: theme.fg, fontFamily: theme.fontDisplay,
      localT, entrance: { delay: 0.05, dur: 0.45 }
    });

    const cols = safe.aspect === '9:16'
      ? MVS.vstack(contentSlot, [0.38, 0.62], 24)
      : MVS.hstack(contentSlot, [0.36, 0.64], 28);

    const kpis = MVS.vstack(cols[0], 2, 20);
    MVS.drawMetricCard(ctx, kpis[0], {
      id: 'kpi_overlap', theme, localT, delay: 0.12,
      label: 'AABB Collisions', from: 66.7, value: 0.0, decimals: 1, suffix: '%',
      sublabel: 'Guaranteed by MVS auto-layout', accentColor: theme.ok
    });
    MVS.drawMetricCard(ctx, kpis[1], {
      id: 'kpi_speed', theme, localT, delay: 0.24,
      label: 'Telemetry Audit', from: 15.0, value: 1.4, decimals: 1, suffix: 's',
      sublabel: 'Headless Playwright V8 sweep', accentColor: theme.accent
    });

    MVS.drawAreaChart(ctx, cols[1], {
      id: 'proof_chart', theme, localT, delay: 0.18,
      title: 'Small-Model Quality Convergence (Iter 1 → Iter 3)',
      data: [54, 71, 84, 92, 96],
      labels: ['Raw Draft', 'Iter #3 Studio'],
      suffix: ' pts', color: theme.accent
    });
  },

  cta({ ctx, localT, safe, width, height, theme, scene }) {
    MVS.drawBackdrop(ctx, width, height, localT + 9, { theme, variant: 'mesh-grid' });
    const centerBox = MVS.insetRect(safe, Math.round(safe.w * 0.08), Math.round(safe.h * 0.22));
    const card = MVS.drawCard(ctx, centerBox, {
      id: 'cta_card', theme, localT, accentBar: 'top', accentColor: theme.accent,
      entrance: { delay: 0.05, dur: 0.52, bounce: 0.14 }
    });
    if (card) {
      const rows = MVS.vstack(card.inner, [0.62, 0.38], 14);
      MVS.drawTextAutoFit(ctx, scene.text, rows[0], {
        id: 'cta_hero', role: 'hero', align: 'center', color: theme.fg,
        fontFamily: theme.fontDisplay, bgHint: card.bg, allowOverlapIds: [card.id]
      });
      MVS.drawTextAutoFit(ctx, 'window.seek(t) · BT.709 · -14 LUFS', rows[1], {
        id: 'cta_sub', role: 'subtitle', align: 'center', color: theme.accent,
        fontFamily: theme.fontMono, bgHint: card.bg, allowOverlapIds: [card.id]
      });
    }
  }
};

let VIDEO = { width: 1920, height: 1080, fps: 30, duration: 12 };

window.onReady = async function onReady() {
  if (window.__TIMELINE__) {
    TL = Object.assign(TL, window.__TIMELINE__);
  } else if (location.protocol.startsWith('http')) {
    try {
      const res = await fetch('timeline.json');
      if (res.ok) TL = Object.assign(TL, await res.json());
    } catch (_) { /* standalone mode */ }
  }
  const ar = new URLSearchParams(location.search).get('ar');
  if (ar === '9:16') { TL.width = 1080; TL.height = 1920; TL.meta = { ...TL.meta, aspect: '9:16' }; }
  if (ar === '1:1')  { TL.width = 1080; TL.height = 1080; TL.meta = { ...TL.meta, aspect: '1:1' }; }
  VIDEO = { width: TL.width, height: TL.height, fps: TL.fps, duration: TL.duration };
  canvas.width = VIDEO.width;
  canvas.height = VIDEO.height;
  window.VIDEO = VIDEO;
  await document.fonts.ready;
};

window.seek = function seek(t) {
  MVS.renderTimeline(ctx, TL, SCENES, t, { theme: TL.meta?.style || 'linear-dark' });
};

window.renderAudio = async function renderAudio() {
  const cues = TL.scenes.slice(1).map((s) => s.start);
  return MVS.synthStudioAudio({ bpm: TL.bpm || 120, duration: TL.duration, cues });
};

// Initialize immediately for browser preview & renderer
window.onReady().then(() => window.seek(0));
</script>
</body>
</html>
